function change(o){o.id=rid();o.ts=Date.now();o.dev=DEV;apply(DB,o);Q.push(o);persist();render();soon()}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function render(){
 $('tb').innerHTML=T.map(function(t){return '<button data-t="'+t[0]+'"'+(t[0]===tab?' class="on"':'')+'>'+t[1]+'</button>'}).join('');
 $('dn').innerHTML=DN.map(function(d){return '<button data-d="'+d+'"'+(d===dn?' class="on"':'')+'>'+esc(d)+'</button>'}).join('');
 var names=DB.c[tab],tot=0,nb=0;
 names.forEach(function(n){var l=ys(DB,tab,dn,n).length;tot+=l;if(l)nb++});
 $('sb').textContent=tot+' année(s) trouvée(s) en '+dn+' · '+nb+' pays sur '+names.length;
 $('ct').innerHTML=names.map(function(n){
  var y=ys(DB,tab,dn,n),ed=ec===n;
  return '<div class="ct"><h3><span class="nm">'+esc(n)+(ed?'<button class="dl" data-del="'+esc(n)+'" aria-label="Supprimer le pays">✕</button>':'')+'</span><span class="r">'+y.length+'<span class="pc"><button class="pn'+(ed?' on':'')+'" data-p="'+esc(n)+'">'+(ed?'✔':'✏️')+'</button></span></span></h3><div class="ch">'
  +(y.length?y.map(function(v,i){return ed?'<button class="y x" data-c="'+esc(n)+'" data-i="'+i+'">'+esc(v)+' ✕</button>':'<span class="y">'+esc(v)+'</span>'}).join(''):'<span class="em">Aucune année</span>')
  +'</div>'+(ed?'<div class="ad"><input data-n="'+esc(n)+'" placeholder="Ajouter une année" inputmode="numeric"><button data-a="'+esc(n)+'">+</button></div>':'')+'</div>'}).join('');
}
var pend=null;
function ask(txt,lb,fn){pend=fn;$('mt').textContent=txt;$('mo').textContent=lb;$('md').style.display='flex'}
$('mc').onclick=function(){$('md').style.display='none';pend=null};
$('mo').onclick=function(){$('md').style.display='none';var f=pend;pend=null;if(f)f()};
function add(n){
 var i=document.querySelector('input[data-n]'),v=i&&i.value.trim();if(!v)return;
 ask('Ajouter l’année '+v+' ('+dn+') pour '+n+' ?','Ajouter',function(){ec=null;change({op:'addYear',t:tab,d:dn,c:n,y:v})});
}
$('tb').onclick=function(e){var t=e.target.getAttribute('data-t');if(t){tab=t;ec=null;render()}};
$('dn').onclick=function(e){var d=e.target.getAttribute('data-d');if(d){dn=d;ec=null;render()}};
$('ct').onclick=function(e){
 var t=e.target,c=t.getAttribute('data-c'),a=t.getAttribute('data-a'),p=t.getAttribute('data-p'),dl=t.getAttribute('data-del');
 if(p){ec=(ec===p)?null:p;render()}
 if(c){var yr=ys(DB,tab,dn,c)[+t.getAttribute('data-i')];ask('Supprimer l’année '+yr+' ('+dn+') pour '+c+' ?','Supprimer',function(){change({op:'delYear',t:tab,d:dn,c:c,y:yr})})}
 if(a)add(a);
 if(dl)ask('Supprimer le pays '+dl+' et toutes ses années (tous les montants) de l’onglet '+lab(tab)+' ?','Supprimer',function(){ec=null;change({op:'delCountry',t:tab,c:dl})});
};
$('ct').onkeydown=function(e){var n=e.target.getAttribute&&e.target.getAttribute('data-n');if(n&&e.key==='Enter')add(n)};
$('pl').onclick=function(){var r=$('np');r.style.display=r.style.display==='flex'?'none':'flex';if(r.style.display==='flex')$('ni').focus()};
function addCountry(){
 var n=$('ni').value.trim();if(!n)return;
 if(DB.c[tab].some(function(x){return x.toLowerCase()===n.toLowerCase()})){status('Ce pays existe déjà dans cet onglet.');return}
 ask('Ajouter le pays '+n+' dans l’onglet '+lab(tab)+' ?','Ajouter',function(){$('ni').value='';$('np').style.display='none';ec=n;change({op:'addCountry',t:tab,c:n})});
}
$('nb').onclick=addCountry;$('ni').onkeydown=function(e){if(e.key==='Enter')addCountry()};

/* ---------- Synchronisation Google Sheets ---------- */
var busy=false,err=null,tmr=null;
function hm(ts){var d=new Date(ts);return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
function status(msg){
 if(msg){$('sy').textContent=msg;return}
 var n=Q.length,w=n?' · '+n+' modification(s) en attente':'';
 if(!CFG.u||!CFG.k)$('sy').textContent='⚙️ Google Sheets non configuré — données sur cet appareil'+w;
 else if(!navigator.onLine)$('sy').textContent='📴 Hors ligne'+(n?w:' · tout est à jour');
 else if(busy)$('sy').textContent='⏳ Synchronisation…';
 else if(err)$('sy').textContent='⚠️ '+err+w+' (nouvel essai automatique)';
 else if(n)$('sy').textContent='⏳'+w;
 else $('sy').textContent='✅ Synchronisé avec Google Sheets'+(LAST?' · '+hm(LAST):'');
}
function soon(d){clearTimeout(tmr);tmr=setTimeout(sync,d==null?800:d)}
function wire(o){return{id:o.id,ts:o.ts,dev:o.dev,op:o.op,tab:lab(o.t),d:o.d||'',c:o.c,y:o.y==null?'':String(o.y)}}
function initPayload(){var c=[],y=[];T.forEach(function(t){var k=t[0];DB.c[k].forEach(function(n){c.push([t[1],n]);DN.forEach(function(d){ys(DB,k,d,n).forEach(function(v){y.push([t[1],d,n,String(v)])})})})});return{countries:c,years:y}}
async function call(body){
 var ac=new AbortController(),to=setTimeout(function(){ac.abort()},30000);
 try{var r=await fetch(CFG.u,{method:'POST',body:JSON.stringify(body),signal:ac.signal,redirect:'follow'});
  if(!r.ok)throw new Error('Erreur '+r.status);
  var j=await r.json();if(j.error)throw new Error(j.error);return j}
 finally{clearTimeout(to)}
}
async function sync(){
 if(busy||!CFG.u||!CFG.k||!navigator.onLine){status();return}
 busy=true;status();
 var batch=Q.slice();
 try{
  var st=await call({k:CFG.k,dev:DEV,ops:batch.map(wire)});
  if(st.empty){var ip=initPayload();batch=Q.slice();st=await call({k:CFG.k,dev:DEV,init:ip})}
  var sent={};batch.forEach(function(o){sent[o.id]=1});
  Q=Q.filter(function(o){return !sent[o.id]});
  DB=fromServer(st);Q.forEach(function(o){apply(DB,o)});
  LAST=Date.now();wr(KL,LAST);err=null;persist();
  if(ec&&DB.c[tab].indexOf(ec)<0)ec=null;
  var f=document.activeElement&&document.activeElement.getAttribute&&document.activeElement.getAttribute('data-n'),v=f&&document.activeElement.value;
  render();
  if(f){var i=document.querySelector('input[data-n]');if(i){i.value=v;i.focus()}}
 }catch(e){err=(e&&e.name==='AbortError')?'Délai dépassé':(e&&e.message==='Clé invalide'?'Clé secrète invalide':'Synchronisation impossible')}
 busy=false;status();
 if(Q.length&&!err)soon(300);
}
window.addEventListener('online',function(){err=null;sync()});
window.addEventListener('offline',function(){status()});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')sync()});
setInterval(function(){if(Q.length||err)sync()},30000);
setInterval(function(){if(!Q.length)sync()},300000);

/* ---------- Réglages ---------- */
$('gear').onclick=function(){$('cu').value=CFG.u||'';$('ck').value=CFG.k||'';$('cl').style.display='none';$('cf').style.display='flex'};
$('cx').onclick=function(){$('cf').style.display='none'};
$('cs').onclick=function(){
 var u=$('cu').value.trim(),k=$('ck').value.trim();
 if(u&&!/^https:\/\/script\.google(usercontent)?\.com\//.test(u)){alert('L’adresse doit commencer par https://script.google.com/');return}
 CFG={u:u,k:k};wr(KC,CFG);err=null;$('cf').style.display='none';sync();
};
$('cc').onclick=function(){
 var u=$('cu').value.trim(),k=$('ck').value.trim();if(!u||!k){alert('Renseignez d’abord l’adresse et la clé.');return}
 var l=location.origin+location.pathname+'#cfg='+btoa(unescape(encodeURIComponent(JSON.stringify({u:u,k:k}))));
 var t=$('cl');t.value=l;t.style.display='block';t.select();
 if(navigator.clipboard)navigator.clipboard.writeText(l).then(function(){$('cc').textContent='✔ Lien copié'},function(){});
};

/* ---------- Export Excel ---------- */
var FM=[['rech','Grande quantité.xlsx'],['trouve','Petite quantité.xlsx'],['micro','Micro-États.xlsx'],['autre','Autre.xlsx']];
function lb(d){return d.replace(/^(\d+)([€c])$/,'$1 $2')}
function wbFor(t){
 var wb=XLSX.utils.book_new();
 DN.forEach(function(d){
  var ns=DB.c[t],mx=0;ns.forEach(function(n){mx=Math.max(mx,ys(DB,t,d,n).length)});
  var rows=[['Années trouvées – '+lb(d)],ns.slice()];
  for(var i=0;i<mx;i++)rows.push(ns.map(function(n){var v=ys(DB,t,d,n)[i];return v==null?null:(/^\d+$/.test(v)?+v:v)}));
  var ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:Math.max(ns.length-1,0)}}];ws['!cols']=ns.map(function(){return{wch:13}});
  XLSX.utils.book_append_sheet(wb,ws,d);
 });
 return wb;
}
$('xp').onclick=async function(){
 if(!window.XLSX){status('Export Excel indisponible (bibliothèque non chargée)');return}
 var ok=0;
 for(var k=0;k<FM.length;k++){if(!DB.c[FM[k][0]].length)continue;XLSX.writeFile(wbFor(FM[k][0]),FM[k][1]);ok++;await new Promise(function(r){setTimeout(r,600)})}
 status(ok+' fichier(s) Excel enregistré(s)');setTimeout(function(){status()},4000);
};

if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(function(){});
render();status();sync();
</script></body></html>
